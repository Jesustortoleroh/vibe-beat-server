name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          # Provide mock secrets so server.ts doesn't throw on import
          SESSION_SECRET: test-secret-for-ci
          MONGO_URI: mongodb://127.0.0.1:27017/test

      - name: Build Project
        run: npm run build

      - name: Verify Build Output
        run: |
          # Ensure the compiled server and swagger files exist
          test -f dist/server.js
          test -f dist/swagger.json
